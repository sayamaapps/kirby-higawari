# Tab "Tageskarte": date and dishes. A site adds it with
#   tabs:
#     tageskarte:
#       extends: higawari/tabs/daily-menu
label: higawari.panel.tab.label
icon: list-bullet
fields:
  higawariInfo:
    type: info
    text: higawari.panel.info.text
  tageskarteDatum:
    extends: higawari/fields/date
  tagesgerichte:
    extends: higawari/fields/dishes
  # A standing line under the dishes (1.8). Fude: part of the page collection.
  tageskarteHinweis:
    label: higawari.panel.note.label
    type: text
    maxlength: 160
    help: higawari.panel.note.help
    fude: true
