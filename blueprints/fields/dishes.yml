# Structure field `tagesgerichte`: up to five dishes. Field names are a
# compatibility promise (README, Content field contract): sites that already
# store exactly these names keep working unchanged.
label: higawari.panel.dishes.label
type: structure
max: 5
# For the separate package Fude (changes by chat): a bot may replace the whole
# menu, update or delete a dish, and every change sets the date: today, or
# another day the chat names (editable, "the menu for tomorrow"), never a past one.
# readImages: the chat side may read a photo of the blackboard as the menu.
# Needs Fude 1.4 or later. Kirby ignores the key when Fude is not installed.
fude:
  description: Today's dishes. Each change replaces the whole menu.
  actions: [replace, update, delete]
  maxEntries: 5
  touch: {field: tageskarteDatum, value: today, editable: true}
  readImages: true
columns:
  gericht:
    width: 1/2
  zeit:
    width: 1/6
  uhrzeit:
    width: 1/6
  preis:
    width: 1/6
fields:
  gericht:
    label: higawari.panel.dish.name.label
    type: text
    required: true
    maxlength: 160
  beschreibung:
    label: higawari.panel.dish.description.label
    type: textarea
    buttons: false
    size: small
    maxlength: 300
    help: higawari.panel.dish.description.help
  preis:
    label: higawari.panel.dish.price.label
    type: number
    min: 0
    max: 999
    step: 0.01
    help: higawari.panel.dish.price.help
  variante:
    label: higawari.panel.dish.variant.label
    type: text
    maxlength: 60
    width: 1/2
    help: higawari.panel.dish.variant.help
  variantenpreis:
    label: higawari.panel.dish.variant.price.label
    type: number
    min: 0
    max: 999
    step: 0.01
    width: 1/2
    help: higawari.panel.dish.variant.price.help
  kennzeichnungen:
    label: higawari.panel.dish.markers.label
    type: text
    maxlength: 40
    help: higawari.panel.dish.markers.help
  # Time of day (1.8): `bis` is gone from `uhrzeit` on (a lunch dish), `ab`
  # is shown all day with „ab … Uhr“. Values are part of the field contract.
  # Option texts as language arrays: Kirby does not resolve translation keys
  # in the options of a structure's sub-field.
  zeit:
    label: higawari.panel.dish.time.label
    type: toggles
    default: ganztags
    width: 1/2
    options:
      - value: ganztags
        text: {de: Ganztags, en: All day}
      - value: bis
        text: {de: Bis, en: Until}
      - value: ab
        text: {de: Ab, en: From}
    help: higawari.panel.dish.time.help
  uhrzeit:
    label: higawari.panel.dish.clock.label
    type: time
    default: "15:00"
    width: 1/2
    help: higawari.panel.dish.clock.help
